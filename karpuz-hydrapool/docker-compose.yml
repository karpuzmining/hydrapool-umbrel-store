version: "3.7"

services:
  app_proxy:
    environment:
      # Container name is <app id>_<service>_1. The UI is the portal, not the pool.
      APP_HOST: karpuz-hydrapool_portal_1
      APP_PORT: "8080"

  portal:
    # Umbrel replaces this file on update and pulls the image. The digest is
    # the multi-arch index (amd64 and arm64), so the dashboard is not stuck
    # on the portal/ copy from the first install.
    image: ghcr.io/karpuzmining/hydrapool-umbrel-portal:1.0.9@sha256:02838f3379f4b5d9fae2cc9ca85223b1b1c254e6e691b88c60609e8632b40898
    restart: unless-stopped
    stop_grace_period: 30s
    user: "0:0"
    command: ["python3", "-u", "/opt/portal/server.py"]
    environment:
      DATA_DIR: /data
      HYDRAPOOL_API_URL: http://hydrapool:46884
      # Host port miners use. Inside the pool container the listen port stays 3333.
      HYDRAPOOL_STRATUM_PORT: "34533"
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME:-umbrel.local}
      DEVICE_HOSTNAME: ${DEVICE_HOSTNAME:-umbrel}
      APP_BITCOIN_NETWORK: ${APP_BITCOIN_NETWORK:-}
      APP_BITCOIN_NODE_IP: ${APP_BITCOIN_NODE_IP:-}
      APP_BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT:-}
      APP_BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER:-}
      APP_BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS:-}
      APP_BITCOIN_ZMQ_HASHBLOCK_PORT: ${APP_BITCOIN_ZMQ_HASHBLOCK_PORT:-}
    volumes:
      # Dashboard code is in the image above. Only pool data is mounted.
      # hooks/pre-start still refreshes scripts/ for the pool container,
      # because Umbrel updates do not copy that directory.
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  hydrapool:
    # Upstream image is amd64-only. Pinning the platform lets arm64 Umbrel
    # pull it instead of aborting the whole compose file. The portal does
    # not depend on this service, so a pool crash still leaves the UI up.
    image: ghcr.io/256foundation/hydrapool:latest
    platform: linux/amd64
    # on-failure ignores exit 0. A missing script or a clean shutdown then
    # stays dead. unless-stopped brings it back until Umbrel stops the app.
    restart: unless-stopped
    stop_grace_period: 1m
    user: "0:0"
    entrypoint: ["/bin/sh", "/opt/umbrel/run-hydrapool.sh"]
    environment:
      RUST_LOG: info
    volumes:
      - ${APP_DATA_DIR}/scripts/run-hydrapool.sh:/opt/umbrel/run-hydrapool.sh:ro
      - ${APP_DATA_DIR}/data:/data
    ports:
      # 34533 on the host, 3333 in the container. Host 3333 belongs to
      # Public Pool on many Umbrels, and 2018 is that app's current port.
      # 3334 is this app's dashboard. The API stays unpublished.
      - "34533:3333"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ ! -s /data/config/config.toml ]; then exit 0; fi; pass=$$(cat /data/hydrapool/api.password); wget --spider -q --http-user=hydrapool --http-password=\"$$pass\" --auth-no-challenge http://127.0.0.1:46884/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

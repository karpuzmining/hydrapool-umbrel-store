name: Publish portal image

# Official Umbrel apps ship UI code in a pinned image. This builds that image.
# The Actions token cannot change org package visibility (the API returns
# 404), so the job proves Umbrel can pull the tag with no credentials.
on:
  workflow_dispatch:
  push:
    branches: [master, cursor/share-row-fe5b]
    paths:
      - karpuz-hydrapool/portal/**
      - .github/workflows/portal-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(python3 -c 'import pathlib,re; text=pathlib.Path("karpuz-hydrapool/umbrel-app.yml").read_text(); print(re.search(r"version: \"([^\"]+)\"", text).group(1))')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: karpuz-hydrapool/portal
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/karpuzmining/hydrapool-umbrel-portal:${{ steps.version.outputs.version }}
            ghcr.io/karpuzmining/hydrapool-umbrel-portal:latest
      - name: Confirm an Umbrel can pull the image
        run: |
          docker logout ghcr.io
          docker pull "ghcr.io/karpuzmining/hydrapool-umbrel-portal:${{ steps.version.outputs.version }}"

# Added on top of karpuz-hydrapool/docker-compose.yml.
# Bind mounts of app files stay in the app compose file and use APP_DATA_DIR.
# This file only adds the fake Bitcoin node and publishes the dashboard.

services:
  mock-bitcoin:
    image: python:3.12-alpine
    command: ["python3", "-u", "/opt/mock/mock_bitcoin.py"]
    volumes:
      - ${VERIFY_MOCK_SCRIPT}:/opt/mock/mock_bitcoin.py:ro
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8332', timeout=3)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  portal:
    ports:
      - "8080:8080"
    depends_on:
      - mock-bitcoin

  hydrapool:
    depends_on:
      - mock-bitcoin
